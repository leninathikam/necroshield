[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "necroshield"
version = "0.1.0"
description = "Deterministic adversarial testing arena for synthetic agent workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "hypothesis>=6.120,<7"]

[project.scripts]
necroshield-benchmark = "necroshield.cli:main"
necroshield-mcp = "necroshield.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["necroshield"]
