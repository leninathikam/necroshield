name: Verify the synthetic arena
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pip install --no-deps -e ./backend
      - run: python -m pytest backend/tests
      - run: python .kiro/scripts/validate_config.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: necroshield
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: necroshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U necroshield -d necroshield_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NECROSHIELD_TEST_DATABASE_URL: postgresql+psycopg://necroshield:synthetic-ci-only@127.0.0.1:5432/necroshield_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pip install --no-deps -e ./backend
      - run: python -m pytest backend/tests/test_postgres.py
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install --require-hashes -r backend/requirements.lock
      - run: backend/.venv/bin/python -m pip install --no-deps -e ./backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
