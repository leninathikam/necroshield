name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-test.txt -c constraints.txt
      - name: unit, scenario regression, and property tests
        run: python -m pytest -o addopts="" -q -rs tests

  evidence:
    name: benchmark and standalone verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: run every scenario and verify each export and the bundle with pinned digests
        working-directory: backend
        run: |
          python -m necroshield benchmark --db "$RUNNER_TEMP/bench.db"
          python -m necroshield scenarios --pins > "$RUNNER_TEMP/pins.json"
          python -c "import json; from necroshield.catalog import REGISTRY; from necroshield.runner import run_pair; from necroshield.metrics import summarize, BUNDLE_FORMAT; p=[run_pair(s).export() for s in REGISTRY.values()]; json.dump({'format': BUNDLE_FORMAT, 'summary': summarize(p), 'pairs': p}, open('$RUNNER_TEMP/bundle.json', 'w'))"
          python -I -S ../scripts/verify_evidence.py "$RUNNER_TEMP/bundle.json" --pins "$RUNNER_TEMP/pins.json"
          for id in $(python -c "from necroshield.catalog import REGISTRY; print(' '.join(REGISTRY))"); do
            out="$RUNNER_TEMP/$id.json"
            python -m necroshield run "$id" --db "$RUNNER_TEMP/runs.db" --export "$out"
            sd=$(python -c "from necroshield.catalog import REGISTRY as R; print(R['$id'].digest())")
            pd=$(python -c "from necroshield.catalog import REGISTRY as R; print(R['$id'].policy.digest())")
            python -I -S ../scripts/verify_evidence.py "$out" --scenario-digest "$sd" --policy-digest "$pd"
          done

  api:
    name: api, mcp, and live-loop integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-test.txt -c constraints.txt
      - name: full backend suite (nothing may be skipped here)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -o addopts="" -q -rs tests | tee "$RUNNER_TEMP/pytest.txt"
          if grep -q "skipped" "$RUNNER_TEMP/pytest.txt"; then echo "::error::tests were skipped"; exit 1; fi

  security:
    name: dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: audit python dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-test.txt -c backend/constraints.txt pip-audit
          pip-audit --skip-editable
      - name: scan history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  frontend:
    name: frontend lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: install (lockfile when present)
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - uses: actions/upload-artifact@v5
        with:
          name: package-lock
          path: frontend/package-lock.json
      - run: npm ls --depth=0
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-out
          path: frontend/out

  e2e:
    name: playwright against the real api
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v5
        with:
          name: frontend-out
          path: frontend/out
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt
      - name: install playwright
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npx playwright install --with-deps chromium
      - name: run browser workflows (desktop and mobile)
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-results
          path: |
            frontend/test-results
            frontend/playwright-report

  container:
    name: container under production conditions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: docker build -t necroshield:ci .
      - name: start like Render (assigned PORT, root-owned disk, proxy hop, no origin config)
        run: |
          sudo mkdir -p /srv/ns-data && sudo chown root:root /srv/ns-data && sudo chmod 755 /srv/ns-data
          docker run -d --name ns -p 10000:10000 -e PORT=10000 -e NECROSHIELD_PROXY_HOPS=1 \
            -e NECROSHIELD_SEED_ON_START=1 -e NECROSHIELD_WRITE_LIMIT=5 -v /srv/ns-data:/data necroshield:ci
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:10000/api/health && break; sleep 1; done
      - name: judge path, same-origin writes, isolation, limits
        run: python3 .github/scripts/container_smoke.py http://127.0.0.1:10000
      - name: peak memory stays under the Render Free limit after the judge flow
        run: |
          for i in 1 2 3; do curl -sf http://127.0.0.1:10000/api/evolution >/dev/null; done
          peak_kb=$(docker exec ns grep VmHWM /proc/1/status | awk '{print $2}')
          echo "peak resident memory: $((peak_kb / 1024)) MB (limit 512 MB)"
          test "$peak_kb" -lt 524288
      - name: service runs as uid 10001 and the disk file belongs to it
        run: |
          docker exec ns cat /proc/1/status | grep -E "^Uid:\s+10001\s"
          sudo stat -c '%u %n' /srv/ns-data/necroshield.db | grep -q '^10001 '
      - name: history persists across a restart
        run: |
          before=$(curl -sf http://127.0.0.1:10000/api/health | python3 -c "import json,sys; print(json.load(sys.stdin)['stored_pairs'])")
          docker restart ns
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:10000/api/health >/dev/null && break; sleep 1; done
          after=$(curl -sf http://127.0.0.1:10000/api/health | python3 -c "import json,sys; print(json.load(sys.stdin)['stored_pairs'])")
          echo "stored pairs before=$before after=$after"; test "$before" -gt 0 && test "$before" = "$after"
      - name: demo reset inside the container
        run: |
          docker exec ns python -m necroshield reset-store --db /data/necroshield.db --yes
          test "$(curl -sf http://127.0.0.1:10000/api/health | python3 -c "import json,sys; print(json.load(sys.stdin)['stored_pairs'])")" = 0
      - name: free-plan configuration from render.yaml (database in /tmp, no disk)
        run: |
          docker run -d --name nsfree -p 10001:10000 -e PORT=10000 -e NECROSHIELD_DB=/tmp/necroshield.db \
            -e NECROSHIELD_SEED_ON_START=1 -e NECROSHIELD_PROXY_HOPS=1 -e NECROSHIELD_MAX_PAIRS=1000 necroshield:ci
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:10001/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:10001/api/benchmark | python3 -c "import json,sys; b=json.load(sys.stdin); assert b['missing_scenarios'] == [], b; print('free plan: seeded', b['summary']['scenarios'], 'scenarios')"
          docker exec nsfree stat -c '%a %U' /tmp | grep -qx '1777 root'
          docker exec nsfree cat /proc/1/status | grep -E "^Uid:\s+10001\s"
      - if: always()
        run: docker logs ns || true
