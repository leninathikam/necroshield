
services:
  - type: web
    name: necroshield
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NECROSHIELD_ALLOWED_ORIGINS
        sync: false
      - key: NECROSHIELD_DB
        value: /tmp/necroshield.db
      - key: NECROSHIELD_WRITE_LIMIT
        value: "30"
      - key: NECROSHIELD_LIVE_LIMIT
        value: "3"
      - key: NECROSHIELD_MAX_PAIRS
        value: "1000"
