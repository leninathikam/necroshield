# Render blueprint (https://render.com/docs/blueprint-spec).
# One Docker web service with a persistent disk for the SQLite evidence store.
# Render assigns PORT and RENDER_EXTERNAL_URL itself; the app reads both.
services:
  - type: web
    name: necroshield
    runtime: docker
    plan: starter            # persistent disks need a paid instance type
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NECROSHIELD_PROXY_HOPS
        value: "1"           # Render's proxy appends the client address to X-Forwarded-For
      - key: NECROSHIELD_SEED_ON_START
        value: "1"           # judges never land on an empty benchmark
      - key: NECROSHIELD_MAX_PAIRS
        value: "5000"        # retention cap; oldest non-benchmark pairs are pruned
      - key: NECROSHIELD_WRITE_LIMIT
        value: "30"
      - key: NECROSHIELD_BENCHMARK_LIMIT
        value: "4"
      - key: NECROSHIELD_GLOBAL_WRITE_LIMIT
        value: "600"
      # Live-model variables are intentionally absent. Paid inference is operator-only:
      # see docs/live-evaluation.md.
    disk:
      name: evidence
      mountPath: /data
      sizeGB: 1
